<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recibo rápido</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2b705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recibo">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff1; --surface:#ffffff; --ink:#1c2530; --muted:#5d6b78; --line:#cfd6dc;
  --accent:#f2b705; --accent-ink:#1c2530; --field:#f6f8f9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14181d;--surface:#1d232a;--ink:#e8ecef;--muted:#98a5b1;--line:#333d47;--field:#161b21;}
}
:root[data-theme="dark"]{--bg:#14181d;--surface:#1d232a;--ink:#e8ecef;--muted:#98a5b1;--line:#333d47;--field:#161b21;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;font-weight:800;margin:4px 0 16px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem Archivo,sans-serif;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:1rem Archivo,sans-serif}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:.86rem;margin:6px 0 0}
.btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:800 1.05rem Archivo,sans-serif;cursor:pointer}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--ink);margin-top:10px;font-weight:600}
.logo-box{display:flex;align-items:center;gap:14px;margin-top:6px}
.logo-box img{max-height:64px;max-width:140px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px}
.logo-box .none{width:64px;height:64px;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:.7rem;text-align:center}
.logo-box input{padding:8px}
.toast{color:var(--muted);font-size:.9rem;margin-top:10px;min-height:1.2em}
#preview{margin-top:24px}
#preview .actions{margin-bottom:12px}

/* recibo: sempre papel branco */
.recibo{background:#fff;color:#111;border:1px solid #cfd6dc;border-radius:4px;padding:28px 24px;font-family:"Source Serif 4",Georgia,serif;line-height:1.55;overflow-x:auto}
.recibo header{display:flex;align-items:center;gap:16px;border-bottom:3px solid #111;padding-bottom:14px;margin-bottom:18px}
.recibo header img{max-height:70px;max-width:160px}
.recibo header .emp{font-family:Archivo,sans-serif;font-weight:800;font-size:1.05rem;line-height:1.25}
.recibo header .emp small{display:block;font-weight:400;font-size:.82rem;color:#444}
.recibo h2{font-family:Archivo,sans-serif;font-size:1.5rem;font-weight:800;margin:0 0 4px}
.recibo .valor{font-family:Archivo,sans-serif;font-weight:800;font-size:1.3rem;margin:0 0 14px}
.recibo p{margin:0 0 12px}
.recibo table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.95rem}
.recibo th,.recibo td{border-bottom:1px solid #bbb;padding:7px 6px;text-align:left}
.recibo th:nth-child(n+2),.recibo td:nth-child(n+2){text-align:right;white-space:nowrap}
.recibo .data{margin-top:22px}
.recibo .assin{margin-top:46px;border-top:1px solid #111;width:70%;max-width:320px;padding-top:6px;font-size:.92rem}
.hidden{display:none!important}

@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff}
  main>*:not(#preview){display:none!important}
  #preview .actions{display:none!important}
  main{padding:0;max-width:none}
  #preview{margin:0}
  .recibo{border:0;padding:0}
}
</style>
</head>
<body>
<main>
  <h1>Recibo rápido</h1>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-novo" aria-selected="true">Novo recibo</button>
    <button role="tab" id="t-emp" aria-selected="false">Minha empresa</button>
  </div>

  <section class="panel" id="p-novo">
    <label for="cCnpj">CNPJ do cliente</label>
    <input id="cCnpj" inputmode="numeric" placeholder="00.000.000/0000-00" autocomplete="off">
    <label for="cNome">Razão social ou nome do cliente</label>
    <input id="cNome" autocomplete="off">
    <label for="desc">Descrição do serviço</label>
    <textarea id="desc" placeholder="Ex.: troca de registro e reparo de reboco no banheiro"></textarea>
    <div class="row">
      <div><label for="qtd">Quantidade</label><input id="qtd" inputmode="decimal" placeholder="1"></div>
      <div><label for="val">Valor unitário (R$)</label><input id="val" inputmode="decimal" placeholder="150,00"></div>
    </div>
    <label for="dt">Data</label>
    <input id="dt" type="date">
    <p class="hint">Nenhum campo é obrigatório. Sem quantidade, vale 1.</p>
    <button class="btn" id="gerar">Gerar recibo</button>
  </section>

  <section class="panel hidden" id="p-emp">
    <label for="eNome">Razão social</label>
    <input id="eNome" autocomplete="off">
    <label for="eCnpj">CNPJ</label>
    <input id="eCnpj" inputmode="numeric" placeholder="00.000.000/0000-00" autocomplete="off">
    <label>Logo</label>
    <div class="logo-box">
      <div id="logoSlot"></div>
      <input id="logoFile" type="file" accept="image/*">
    </div>
    <button class="btn alt hidden" id="logoRm">Remover logo</button>
    <button class="btn" id="salvar">Salvar dados da empresa</button>
    <div class="toast" id="toast" role="status"></div>
    <p class="hint">Os dados ficam salvos só neste navegador. Você preenche uma vez.</p>
  </section>

  <div id="preview" class="hidden">
    <div class="actions">
      <button class="btn" id="baixar" style="margin-top:0">Baixar PDF</button>
      <button class="btn alt" id="imprimir">Imprimir</button>
      <div class="toast" id="pdfMsg" role="status"></div>
    </div>
    <article class="recibo" id="recibo"></article>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const KEY='reciboEmpresa';
let emp={nome:'',cnpj:'',logo:''};

try{const s=localStorage.getItem(KEY);if(s)emp=Object.assign(emp,JSON.parse(s));}catch(e){}

/* ---------- utilidades ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function maskCnpj(v){
  const d=v.replace(/\D/g,'').slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
}
function parseBR(s){
  s=(s||'').trim().replace(/[^\d.,]/g,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return parseFloat(s);
}
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

/* ---------- valor por extenso ---------- */
const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const T=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ate999(n){
  if(n===100)return 'cem';
  const c=Math.floor(n/100),r=n%100,p=[];
  if(c)p.push(C[c]);
  if(r){ if(r<20)p.push(U[r]); else{const d=Math.floor(r/10),u=r%10;p.push(T[d]+(u?' e '+U[u]:''));} }
  return p.join(' e ');
}
function inteiro(n){
  if(n===0)return 'zero';
  const g=[[1e9,'bilhão','bilhões'],[1e6,'milhão','milhões'],[1e3,'mil','mil']];
  const partes=[];let resto=n;
  for(const [v,s,p] of g){
    const q=Math.floor(resto/v);resto%=v;
    if(q)partes.push(v===1e3?(q===1?'mil':ate999(q)+' mil'):ate999(q)+' '+(q===1?s:p));
  }
  if(resto)partes.push(ate999(resto));
  let out=partes[0];
  for(let i=1;i<partes.length;i++){
    const ultimo=i===partes.length-1;
    const ligaE=ultimo&&(resto<100||resto%100===0||(partes.length>1&&n%1000<100&&n%1000>0));
    out+=(ligaE?' e ':' ')+partes[i];
  }
  return out;
}
function extenso(valor){
  const cents=Math.round(valor*100),r=Math.floor(cents/100),c=cents%100;
  const out=[];
  if(r>0||c===0){
    const de=(r>=1e6&&r%1e6===0)?' de':'';
    out.push(inteiro(r)+de+(r===1?' real':' reais'));
  }
  if(c>0)out.push(inteiro(c)+(c===1?' centavo':' centavos'));
  return out.join(' e ');
}

/* ---------- abas ---------- */
function aba(nome){
  const novo=nome==='novo';
  $('p-novo').classList.toggle('hidden',!novo);
  $('p-emp').classList.toggle('hidden',novo);
  $('t-novo').setAttribute('aria-selected',novo);
  $('t-emp').setAttribute('aria-selected',!novo);
}
$('t-novo').onclick=()=>aba('novo');
$('t-emp').onclick=()=>aba('emp');

/* ---------- empresa ---------- */
function desenharLogo(){
  $('logoSlot').innerHTML=emp.logo?'<img alt="Logo da empresa" src="'+emp.logo+'">':'<div class="none">sem logo</div>';
  $('logoRm').classList.toggle('hidden',!emp.logo);
}
$('eNome').value=emp.nome;$('eCnpj').value=emp.cnpj;desenharLogo();
$('eCnpj').oninput=e=>e.target.value=maskCnpj(e.target.value);
$('cCnpj').oninput=e=>e.target.value=maskCnpj(e.target.value);

$('logoFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=400,k=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      emp.logo=cv.toDataURL('image/png');desenharLogo();
      $('toast').textContent='Logo carregada. Toque em salvar.';
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
};
$('logoRm').onclick=()=>{emp.logo='';$('logoFile').value='';desenharLogo();};
$('salvar').onclick=()=>{
  emp.nome=$('eNome').value.trim();emp.cnpj=$('eCnpj').value.trim();
  try{localStorage.setItem(KEY,JSON.stringify(emp));$('toast').textContent='Dados salvos.';}
  catch(e){$('toast').textContent='Não consegui salvar neste navegador. A logo pode estar grande demais.';}
};

/* ---------- recibo ---------- */
const hoje=new Date();
$('dt').value=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');

function dataLonga(iso){
  if(!iso)return '';
  const [y,m,d]=iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
}

$('gerar').onclick=()=>{
  const cNome=$('cNome').value.trim(),cCnpj=$('cCnpj').value.trim(),desc=$('desc').value.trim();
  let q=parseBR($('qtd').value);if(isNaN(q)||q<=0)q=1;
  const v=parseBR($('val').value),temV=!isNaN(v);
  const total=temV?q*v:NaN;

  let cab='';
  if(emp.logo||emp.nome||emp.cnpj){
    cab='<header>'+(emp.logo?'<img alt="" src="'+emp.logo+'">':'')+
      '<div class="emp">'+esc(emp.nome)+(emp.cnpj?'<small>CNPJ '+esc(emp.cnpj)+'</small>':'')+'</div></header>';
  }

  const de=cNome||cCnpj?' de <strong>'+esc(cNome)+'</strong>'+(cCnpj?(cNome?', ':'')+'CNPJ '+esc(cCnpj):''):'';
  let corpo='<h2>Recibo</h2>';
  if(temV)corpo+='<div class="valor">'+brl(total)+'</div>';
  corpo+='<p>Recebi'+de+(temV?' a quantia de <strong>'+brl(total)+'</strong> ('+extenso(total)+')':'')+
    (desc?', referente a '+esc(desc)+'.':'.')+'</p>';

  if(temV){
    corpo+='<table><thead><tr><th>Descrição</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr></thead><tbody><tr><td>'+
      esc(desc||'Serviço')+'</td><td>'+q.toLocaleString('pt-BR')+'</td><td>'+brl(v)+'</td><td>'+brl(total)+'</td></tr></tbody></table>';
  }
  corpo+='<p>Dou plena quitação do valor acima.</p>';
  const dt=dataLonga($('dt').value);
  if(dt)corpo+='<p class="data">'+dt+'.</p>';
  corpo+='<div class="assin">'+esc(emp.nome||'Assinatura')+'</div>';

  $('recibo').innerHTML=cab+corpo;
  $('preview').classList.remove('hidden');
  $('preview').scrollIntoView({behavior:'smooth'});
};
$('imprimir').onclick=()=>window.print();
$('baixar').onclick=async()=>{
  const msg=$('pdfMsg');
  try{
    if(!window.html2canvas||!window.jspdf){msg.textContent='Bibliotecas de PDF não carregaram. Confira a internet ou use Imprimir.';return;}
    msg.textContent='Gerando PDF…';
    const cv=await html2canvas($('recibo'),{scale:2,backgroundColor:'#ffffff'});
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    let w=180,h=cv.height*w/cv.width;
    if(h>267){w=w*267/h;h=267;}
    doc.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',15,15,w,h);
    const file=new File([doc.output('blob')],'recibo.pdf',{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});msg.textContent='';return;}
      catch(e){if(e.name==='AbortError'){msg.textContent='';return;}}
    }
    doc.save('recibo.pdf');msg.textContent='PDF baixado.';
  }catch(e){msg.textContent='Não consegui gerar o PDF. Tente o botão Imprimir.';}
};

if(!emp.nome&&!emp.logo)aba('emp');
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
